<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vp</title>
<link rel="stylesheet" href="styles.css?v=2026-05-17-waveform-breathe">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">vp</div>
    <input id="search" type="search" placeholder="Search songs...">
    <button id="refresh" class="icon-btn" title="Refresh library">↻</button>
  </header>

  <nav class="tabs">
    <button class="tab active" data-view="library">Library</button>
    <button class="tab" data-view="playlists">Playlists</button>
    <button class="tab" data-view="now">Now Playing</button>
  </nav>

  <main class="main">
    <section id="view-library" class="view active">
      <div class="library-toolbar" id="collection-filter" aria-label="Song collections">
        <button class="collection-tab active" data-collection="all">All <span class="collection-count">0</span></button>
        <button class="collection-tab" data-collection="secular">Secular <span class="collection-count">0</span></button>
        <button class="collection-tab" data-collection="christian">Christian <span class="collection-count">0</span></button>
      </div>
      <div class="list-header">
        <span class="col-num">#</span>
        <span class="col-title">Title</span>
        <span class="col-actions"></span>
      </div>
      <ul id="library-list" class="song-list"></ul>
      <div id="library-empty" class="empty hidden">
        No songs found. Drop <code>.mp3</code> files into the <code>songs/</code> folder, commit, and push.
      </div>
      <div id="library-error" class="empty hidden"></div>
    </section>

    <section id="view-playlists" class="view">
      <div class="playlist-toolbar">
        <button id="new-playlist">+ New playlist</button>
      </div>
      <div id="playlists-container"></div>
    </section>

    <section id="view-now" class="view now-view">
      <div class="now-stage">
        <div class="now-meta">
          <div class="now-kicker" id="now-kicker">vp</div>
          <h1 id="now-title">Nothing playing</h1>
          <div id="now-subtitle" class="now-subtitle">Pick a song from the library.</div>
        </div>

        <div class="hero-control">
          <button id="hero-play" class="hero-play" title="Play/Pause (Space)">
            <span class="hero-ring"></span>
            <span class="hero-icon">▶</span>
          </button>
          <div class="hero-time">
            <span id="hero-time-current">0:00</span>
            <span id="hero-time-total">0:00</span>
          </div>
        </div>

        <div class="now-queue">
          <div class="queue-label">Up next</div>
          <div id="queue-next">No queue yet</div>
        </div>
      </div>

      <div class="wave-panel">
        <canvas id="waveform" width="1200" height="220" aria-label="Audio waveform"></canvas>
      </div>
    </section>
  </main>

  <footer class="player">
    <div class="now-playing">
      <div class="np-title" id="np-title">Nothing playing</div>
      <div class="np-sub" id="np-sub"></div>
    </div>
    <div class="controls">
      <button id="shuffle" title="Shuffle">🔀</button>
      <button id="prev" title="Previous (Shift+Left)">⏮</button>
      <button id="play" title="Play/Pause (Space)">▶</button>
      <button id="next" title="Next (Shift+Right)">⏭</button>
      <button id="loop" title="Loop" data-mode="off">🔁</button>
    </div>
    <div class="progress">
      <span id="time-current">0:00</span>
      <input id="seek" type="range" min="0" max="100" value="0" step="0.1">
      <span id="time-total">0:00</span>
    </div>
    <div class="volume">
      <span>🔊</span>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="1">
    </div>
  </footer>
</div>

<audio id="audio" preload="metadata"></audio>
<script src="app.js?v=2026-05-17-waveform-breathe"></script>
</body>
</html>
