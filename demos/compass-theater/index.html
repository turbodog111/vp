<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compass - Sky/Sea Theater Study</title>
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <main id="stage" aria-label="Compass animation study">
    <canvas id="scene" aria-hidden="true"></canvas>

    <header class="masthead">
      <div>
        <p class="eyebrow">PAUL OWEN MUSIC / MILI</p>
        <h1>Compass</h1>
        <p class="edition">ROCK VERSION &middot; SKY / MIRROR SEA STUDY</p>
      </div>
      <div class="chapter" aria-live="polite">
        <span id="chapter-index">01</span>
        <div>
          <strong id="chapter-name">DEPARTURE</strong>
          <small id="chapter-detail">Star before bearing</small>
        </div>
      </div>
    </header>

    <section class="lyric-stage" aria-live="polite" aria-atomic="true">
      <p id="lyric-previous" class="lyric-context"></p>
      <p id="lyric-current" class="lyric-current">Instrumental</p>
      <p id="lyric-next" class="lyric-context"></p>
    </section>

    <aside class="bearing" aria-hidden="true">
      <span>N</span>
      <i></i>
      <span id="bearing-value">000</span>
    </aside>

    <footer class="transport">
      <button id="play" class="play" type="button" aria-label="Play Compass">
        <span id="play-icon">&#9654;</span>
      </button>
      <span id="current-time" class="time">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Song progress">
      <span id="duration" class="time">3:46</span>
      <button id="mute" class="mute" type="button" aria-label="Mute audio" title="Mute">VOL</button>
    </footer>
  </main>

  <audio id="audio" preload="metadata" src="../../songs/Paul Owen Music - Compass (Rock Version feat. Mili Vocals).m4a"></audio>
  <script src="./demo.js"></script>
</body>
</html>
