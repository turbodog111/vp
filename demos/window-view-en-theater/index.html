<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Window View - English Train Theater</title>
  <link rel="stylesheet" href="../shared/immersive.css">
</head>
<body>
  <main id="stage" aria-label="Window View English train theater">
    <canvas id="scene" aria-hidden="true"></canvas>
    <header class="masthead">
      <div>
        <p class="eyebrow">MOONLIT STAR / ENGLISH COVER</p>
        <h1>Window<br>View</h1>
        <p class="edition">RAIL &middot; GLASS &middot; DISTANCE</p>
      </div>
      <div class="chapter" aria-live="polite">
        <span id="chapter-index">01</span>
        <div><strong id="chapter-name">DEPARTURE</strong><small id="chapter-detail">Leaving the platform</small></div>
      </div>
    </header>
    <aside class="sigil" aria-hidden="true"><span>NOW / DEPARTING</span><i></i><b id="beat-value">000</b></aside>
    <section class="lyric-stage" aria-live="polite" aria-atomic="true">
      <p id="lyric-previous" class="lyric-context"></p>
      <p id="lyric-current" class="lyric-current">Doors closing.</p>
      <p id="lyric-next" class="lyric-context"></p>
    </section>
    <footer class="transport">
      <button id="play" class="icon-button play" type="button" aria-label="Play Window View" title="Play" disabled><span id="play-icon">&#9654;</span></button>
      <button id="stop" class="icon-button stop" type="button" aria-label="Stop Window View" title="Stop">&#9632;</button>
      <span id="current-time" class="time">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Song progress">
      <span id="duration" class="time">2:25</span>
      <button id="mute" class="icon-button mute" type="button" aria-label="Mute audio" title="Mute">VOL</button>
    </footer>
  </main>
  <audio id="audio" preload="auto"></audio>
  <script src="./demo.js"></script>
  <script src="../shared/immersive.js?v=20260828-theater-worlds-v3"></script>
</body>
</html>
