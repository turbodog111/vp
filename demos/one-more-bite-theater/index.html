<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One More Bite - Appetite Theater</title>
  <link rel="stylesheet" href="../shared/immersive.css">
</head>
<body>
  <main id="stage" aria-label="One More Bite appetite theater">
    <canvas id="scene" aria-hidden="true"></canvas>
    <header class="masthead">
      <div>
        <p class="eyebrow">MILISEN FEAT. KASANE TETO</p>
        <h1>One More Bite</h1>
        <p class="edition">APPETITE &middot; CHROME CONFECTION &middot; AFTERTASTE</p>
      </div>
      <div class="chapter" aria-live="polite">
        <span id="chapter-index">01</span>
        <div><strong id="chapter-name">INTRO</strong><small id="chapter-detail">Instrumental intro</small></div>
      </div>
    </header>
    <aside class="sigil" aria-hidden="true"><span>COURSE / BITE</span><i></i><b id="beat-value">000</b></aside>
    <section class="lyric-stage" aria-live="polite" aria-atomic="true">
      <p id="lyric-previous" class="lyric-context"></p>
      <p id="lyric-current" class="lyric-current">The table is set.</p>
      <p id="lyric-next" class="lyric-context"></p>
    </section>
    <footer class="transport">
      <button id="play" class="icon-button play" type="button" aria-label="Play One More Bite" title="Play" disabled><span id="play-icon">&#9654;</span></button>
      <button id="stop" class="icon-button stop" type="button" aria-label="Stop One More Bite" title="Stop">&#9632;</button>
      <span id="current-time" class="time">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Song progress">
      <span id="duration" class="time">3:14</span>
      <button id="mute" class="icon-button mute" type="button" aria-label="Mute audio" title="Mute">VOL</button>
    </footer>
  </main>
  <audio id="audio" preload="auto"></audio>
  <script src="./demo.js"></script>
  <script src="../shared/immersive.js?v=20260827-playback-fix"></script>
</body>
</html>
