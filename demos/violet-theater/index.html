<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Through Patches of Violet - Mirror Fracture Study</title>
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <main id="stage" aria-label="Through Patches of Violet animation study">
    <canvas id="scene" aria-hidden="true"></canvas>

    <header class="masthead">
      <div class="identity">
        <p class="eyebrow">PAUL OWEN MUSIC / MILI</p>
        <h1>Through Patches<br>of Violet</h1>
        <p class="edition">METAL VERSION &middot; MIRROR / THREAD / TWO WORLDS</p>
      </div>
      <div class="chapter" aria-live="polite">
        <span id="chapter-index">01</span>
        <div>
          <strong id="chapter-name">DIVERGENCE</strong>
          <small id="chapter-detail">At the gate</small>
        </div>
      </div>
    </header>

    <section class="lyric-stage" aria-live="polite" aria-atomic="true">
      <p id="lyric-previous" class="lyric-context"></p>
      <p id="lyric-current" class="lyric-current">Two futures share one frame.</p>
      <p id="lyric-next" class="lyric-context"></p>
    </section>

    <aside class="coordinates" aria-hidden="true">
      <span id="world-label">WORLD / A</span>
      <i></i>
      <span id="bearing-value">000</span>
    </aside>

    <footer class="transport">
      <button id="play" class="play" type="button" aria-label="Play Through Patches of Violet" disabled>
        <span id="play-icon">&#9654;</span>
      </button>
      <span id="current-time" class="time">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Song progress">
      <span id="duration" class="time">3:55</span>
      <button id="mute" class="mute" type="button" aria-label="Mute audio" title="Mute">VOL</button>
    </footer>
  </main>

  <audio id="audio" preload="auto" data-src="../../songs/Paul Owen Music - Through Patches of Violet (Metal Version).m4a"></audio>
  <script src="./demo.js"></script>
</body>
</html>
